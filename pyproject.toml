[project]
name = "mojo-sklearn"
version = "0.1.0"
description = "scikit-learn's core estimators implemented in Mojo"
readme = "README.md"
requires-python = ">=3.10"
license = { text = "MIT" }
authors = [{ name = "Lee Penkman", email = "leepenkman@gmail.com" }]
keywords = ["mojo", "scikit-learn", "machine-learning", "performance"]
dependencies = ["numpy"]

[project.optional-dependencies]
dev = ["pytest", "scikit-learn"]

[project.urls]
Homepage = "https://github.com/lee101/mojo-sklearn"

[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[tool.setuptools]
package-dir = { "" = "python" }

[tool.setuptools.packages.find]
where = ["python"]
